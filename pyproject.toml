[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "wagtail-prose-editor-images"
version = "0.2.5"
description = "Wagtail Image Chooser integration for django-prose-editor."
readme = "README.md"
authors = [{ name = "Vladimir Tarasov" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 8",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "wagtail>=6.0",
    "django-prose-editor>=0.26",
]

[project.urls]
Home = "https://github.com/vovansrnd/wagtail-prose-editor-images"
Source = "https://github.com/vovansrnd/wagtail-prose-editor-images"
Issues = "https://github.com/vovansrnd/wagtail-prose-editor-images/issues"
PyPI = "https://pypi.org/project/wagtail_prose_editor_images/"
